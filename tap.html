<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Um toque — sandbox</title>
<link rel="stylesheet" href="game.css">
<style>
  :root{
    --primary-orange:#F68C18; --white:#FFF; --ink:rgba(0,0,0,.88);
    --bg-chrome-100:#0B1931; --bg-chrome-200:#12233F; --bg-chrome-300:#152A4D;
    --ink-on-dark:#E8EDF8; --ink-on-dark-secondary:rgba(255,255,255,.6);
    --text-caption-size:12px; --text-caption-line-height:16px;
    --text-body-size:14px; --text-body-sm-size:13px; --text-body-lg-size:15px;
    --space-2:6px; --space-3:8px; --space-4:16px; --space-5:24px; --space-6:32px;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px 48px;background:var(--bg-chrome-100);color:var(--ink-on-dark);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .sb{max-width:420px;margin:0 auto}
  h1{font-size:18px;margin:0 0 6px}
  p.n{font-size:12px;color:var(--ink-on-dark-secondary);line-height:17px;margin:0 0 20px}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
  .tools button{background:var(--bg-chrome-300);border:1px solid rgba(255,255,255,.18);
    color:#fff;border-radius:8px;min-height:38px;padding:0 12px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="sb">
  <h1>Um toque — sandbox</h1>
  <p class="n">Versão curta: escolher um alvo, tocar, o avião acerta, prêmio aparece.
     Sem fracasso, sem perícia. Mesmos sprites do jogo grande.</p>

  <div id="tapRoot"></div>

  <div class="tools">
    <button type="button" id="btnReiniciar">Reiniciar</button>
    <button type="button" id="btnPT">PT</button>
    <button type="button" id="btnEN">EN</button>
    <button type="button" id="btnES">ES</button>
  </div>
</div>

<script src="game.js"></script>
<script src="tap.js"></script>
<script>
  var tap = RivaloTap.mount(document.getElementById('tapRoot'), {
    art: true,
    prize: '10 rodadas gratis',
    onEvent: function(n, d){ console.log('[evento]', n, d); }
  });
  document.getElementById('btnReiniciar').addEventListener('click', tap.restart);
  ['PT','EN','ES'].forEach(function(l){
    document.getElementById('btn'+l).addEventListener('click', function(){ tap.setLang(l.toLowerCase()); });
  });
  window.__tap = tap.debug;
</script>
</body>
</html>
